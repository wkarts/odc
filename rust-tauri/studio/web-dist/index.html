<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODC Studio</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6}main{max-width:900px;margin:auto;padding:24px}section{background:#fff;padding:16px;margin:14px 0;border-radius:10px}input,textarea{width:100%;box-sizing:border-box;margin:6px 0;padding:8px}textarea{height:140px}button{margin:6px 8px 6px 0;padding:8px 12px}pre{background:#111827;color:#eee;padding:12px;overflow:auto}</style></head><body><main><h1>ODC Studio Tauri</h1><p>Informe caminhos locais. O aplicativo funciona sem servidor.</p><section><h2>Criar</h2><input id="src" placeholder="Arquivo origem"><input id="dst" placeholder="Destino .odc"><textarea id="meta" placeholder="Metadata JSON"></textarea><button onclick="createOdc()">Criar</button></section><section><h2>Abrir / validar</h2><input id="open" placeholder="Arquivo .odc"><button onclick="info()">Informações</button><button onclick="verify()">Validar</button><pre id="out"></pre></section><section><h2>Extrair</h2><input id="extractDst" placeholder="Destino do arquivo original"><button onclick="extractOdc()">Extrair</button></section><section><h2>Metadata</h2><textarea id="editmeta">{}</textarea><button onclick="saveMeta()">Salvar metadata</button><button onclick="removeMeta()">Remover metadata</button></section></main><script>const invoke=window.__TAURI__.core.invoke;const g=id=>document.getElementById(id);async function createOdc(){try{await invoke('odc_create',{input:g('src').value,output:g('dst').value,metadataJson:g('meta').value});alert('ODC criado.')}catch(e){alert(e)}}async function info(){try{const x=await invoke('odc_info',{path:g('open').value});g('out').textContent=JSON.stringify(x,null,2);g('editmeta').value=JSON.stringify(x.metadata||{},null,2)}catch(e){alert(e)}}async function verify(){alert(await invoke('odc_verify',{path:g('open').value})?'Arquivo íntegro.':'Arquivo inválido.')}async function extractOdc(){try{await invoke('odc_extract',{input:g('open').value,output:g('extractDst').value});alert('Extraído.')}catch(e){alert(e)}}async function saveMeta(){try{await invoke('odc_set_metadata',{path:g('open').value,metadataJson:g('editmeta').value});alert('Metadata atualizada.')}catch(e){alert(e)}}async function removeMeta(){try{await invoke('odc_set_metadata',{path:g('open').value,metadataJson:''});g('editmeta').value='{}';alert('Metadata removida.')}catch(e){alert(e)}}</script></body></html>
