name: Build release assets
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Versão (sem v); vazio usa VERSION
        required: false
        type: string

permissions:
  contents: read

env:
  ODC_VERSION: ${{ inputs.version }}

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.mod
      - name: Build Go matrix
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/go
          while read -r GOOS GOARCH LABEL; do
            ext=''; [[ "$GOOS" == windows ]] && ext='.exe'
            out="dist/go/odc${ext}"
            (cd golang && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../$out" ./cmd/odc)
            pkg="odc-go-${VERSION}-${LABEL}"
            if [[ "$GOOS" == windows ]]; then (cd dist/go && zip -q "${pkg}.zip" "odc${ext}" && rm "odc${ext}"); else (cd dist/go && tar -czf "${pkg}.tar.gz" odc && rm odc); fi
          done <<'EOF'
          linux amd64 linux-x64
          linux arm64 linux-arm64
          windows amd64 windows-x64
          windows 386 windows-x86
          windows arm64 windows-arm64
          darwin amd64 macos-x64
          darwin arm64 macos-arm64
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: release-go
          path: dist/go/*
          if-no-files-found: error
          retention-days: 7

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, label: linux-x64, exe: odc }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64, exe: odc }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, label: windows-x64, exe: odc.exe }
          - { os: windows-2025, target: i686-pc-windows-msvc, label: windows-x86, exe: odc.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, label: windows-arm64, exe: odc.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, label: macos-x64, exe: odc }
          - { os: macos-15, target: aarch64-apple-darwin, label: macos-arm64, exe: odc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}"
          cargo build --manifest-path rust-tauri/Cargo.toml --release --bin odc --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail; VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/rust/pkg
          cp "rust-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/rust/pkg/
          if [[ "${{ runner.os }}" == Windows ]]; then (cd dist/rust/pkg && 7z a -bd -tzip "../odc-rust-${VERSION}-${{ matrix.label }}.zip" "${{ matrix.exe }}" >/dev/null); else (cd dist/rust/pkg && tar -czf "../odc-rust-${VERSION}-${{ matrix.label }}.tar.gz" "${{ matrix.exe }}"); fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-rust-${{ matrix.label }}
          path: dist/rust/odc-rust-*
          if-no-files-found: error
          retention-days: 7

  dotnet-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-2025, rid: win-x86 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - shell: bash
        run: |
          VERSION="${ODC_VERSION:-$(cat VERSION)}"; OUT="dist/dotnet/${{ matrix.rid }}"; mkdir -p "$OUT"
          dotnet publish csharp-dotnet/Odc.Cli/Odc.Cli.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$OUT/publish"
          if [[ "${{ runner.os }}" == Windows ]]; then (cd "$OUT/publish" && 7z a -bd -tzip "../odc-dotnet-${VERSION}-${{ matrix.rid }}.zip" * >/dev/null); else (cd "$OUT/publish" && tar -czf "../odc-dotnet-${VERSION}-${{ matrix.rid }}.tar.gz" *); fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-dotnet-${{ matrix.rid }}
          path: dist/dotnet/${{ matrix.rid }}/odc-dotnet-*
          if-no-files-found: error
          retention-days: 7

  dotnet-studio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-2025, rid: win-x86 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - shell: pwsh
        run: |
          $version = if ($env:ODC_VERSION) {$env:ODC_VERSION} else {(Get-Content VERSION).Trim()}
          $out="dist/dotnet-studio/${{ matrix.rid }}"; New-Item -ItemType Directory -Force "$out/publish"|Out-Null
          dotnet publish csharp-dotnet/Odc.Studio/Odc.Studio.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/publish"
          Compress-Archive -Path "$out/publish/*" -DestinationPath "$out/odc-studio-dotnet-$version-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dotnet-studio-${{ matrix.rid }}
          path: dist/dotnet-studio/${{ matrix.rid }}/odc-studio-*
          if-no-files-found: error
          retention-days: 7

  powershell-studio:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.mod
      - shell: pwsh
        run: |
          $version = if ($env:ODC_VERSION) {$env:ODC_VERSION} else {(Get-Content VERSION).Trim()}
          Copy-Item powershell/Odc.Core.ps1 tools/powershell-launcher/Odc.Core.ps1 -Force
          Copy-Item powershell/ODC-Studio.ps1 tools/powershell-launcher/ODC-Studio.ps1 -Force
          New-Item -ItemType Directory -Force dist/powershell|Out-Null
          Push-Location tools/powershell-launcher
          foreach($x in @(@('amd64','x64'),@('386','x86'),@('arm64','arm64'))){
            $env:GOOS='windows';$env:GOARCH=$x[0]
            go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../dist/powershell/ODC-Studio-$($x[1]).exe" .
          }
          Pop-Location
          foreach($a in @('x64','x86','arm64')){ Compress-Archive -Path "dist/powershell/ODC-Studio-$a.exe" -DestinationPath "dist/powershell/odc-studio-powershell-$version-win-$a.zip" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-powershell-studio
          path: dist/powershell/*.zip
          if-no-files-found: error
          retention-days: 7

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/php
          php -d phar.readonly=0 scripts/build/build-php-phar.php php-laravel "dist/php/odc-php-${VERSION}.phar"
          php "dist/php/odc-php-${VERSION}.phar" verify test-vectors/hello.odc
          (cd php-laravel && zip -qr "../dist/php/odc-php-laravel-${VERSION}-source.zip" composer.json src bin examples README.md)
          mkdir -p dist/php/studio-package/php-laravel
          cp -a studio-php dist/php/studio-package/
          cp -a php-laravel/src dist/php/studio-package/php-laravel/
          cp SPECIFICATION.md SECURITY.md dist/php/studio-package/
          (cd dist/php/studio-package && zip -qr "../odc-studio-php-${VERSION}.zip" .)
          rm -rf dist/php/studio-package
      - uses: actions/upload-artifact@v7
        with:
          name: release-php
          path: dist/php/*
          if-no-files-found: error
          retention-days: 7

  node-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - shell: bash
        run: |
          set -euo pipefail; VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/js
          (cd nodejs && npm pack --pack-destination ../dist/js)
          (cd typescript && npm install --no-audit --no-fund && npm run build && npm pack --pack-destination ../dist/js)
          (cd studio-web && npm install --no-audit --no-fund && npm run build)
          (cd studio-web/dist && zip -qr "../../dist/js/odc-studio-web-${VERSION}.zip" .)
          (cd studio-html-js && npm run check && zip -qr "../dist/js/odc-studio-html-js-${VERSION}.zip" index.html app.js odc.js style.css assets README.md package.json)
      - uses: actions/upload-artifact@v7
        with:
          name: release-js-web
          path: dist/js/*
          if-no-files-found: error
          retention-days: 7

  shell-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/shell/pkg
          cp shell/odc.sh shell/README.md SPECIFICATION.md dist/shell/pkg/
          chmod +x dist/shell/pkg/odc.sh
          (cd dist/shell/pkg && tar -czf "../odc-shell-${VERSION}.tar.gz" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-shell
          path: dist/shell/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  tauri-studio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x64, exe: odc-studio-tauri }
          - { os: ubuntu-24.04-arm, label: linux-arm64, exe: odc-studio-tauri }
          - { os: windows-2025, label: windows-x64, exe: odc-studio-tauri.exe }
          - { os: windows-11-arm, label: windows-arm64, exe: odc-studio-tauri.exe }
          - { os: macos-15-intel, label: macos-x64, exe: odc-studio-tauri }
          - { os: macos-15, label: macos-arm64, exe: odc-studio-tauri }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Materializar ícones obrigatórios do Tauri Studio
        shell: bash
        run: |
          python scripts/ci/ensure-tauri-icons.py
          test -s rust-tauri/studio/src-tauri/icons/icon.png
          test -s rust-tauri/studio/src-tauri/icons/icon.ico
      - shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo build --release --manifest-path rust-tauri/studio/src-tauri/Cargo.toml
          VERSION="${ODC_VERSION:-$(cat VERSION)}"; mkdir -p dist/tauri/pkg
          cp "rust-tauri/studio/src-tauri/target/release/${{ matrix.exe }}" dist/tauri/pkg/
          if [[ "${{ runner.os }}" == Windows ]]; then (cd dist/tauri/pkg && 7z a -bd -tzip "../odc-studio-tauri-${VERSION}-${{ matrix.label }}.zip" "${{ matrix.exe }}" >/dev/null); else (cd dist/tauri/pkg && tar -czf "../odc-studio-tauri-${VERSION}-${{ matrix.label }}.tar.gz" "${{ matrix.exe }}"); fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-tauri-${{ matrix.label }}
          path: dist/tauri/odc-studio-tauri-*
          if-no-files-found: error
          retention-days: 7

  delphi:
    if: ${{ vars.ODC_DELPHI_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, delphi]
    steps:
      - uses: actions/checkout@v6
      - shell: powershell
        run: |
          $version = if ($env:ODC_VERSION) {$env:ODC_VERSION} else {(Get-Content VERSION).Trim()}
          New-Item -ItemType Directory -Force dist\delphi\win32,dist\delphi\win64,dist\delphi\win32\dcu,dist\delphi\win64\dcu|Out-Null
          dcc32 -B -Q -E"$pwd\dist\delphi\win32" -N0"$pwd\dist\delphi\win32\dcu" -I"$pwd\delphi" -U"$pwd\delphi" "$pwd\delphi\OdcCli.dpr"
          dcc32 -B -Q -E"$pwd\dist\delphi\win32" -N0"$pwd\dist\delphi\win32\dcu" -I"$pwd\delphi" -U"$pwd\delphi" "$pwd\delphi\studio\OdcStudio.dpr"
          dcc64 -B -Q -E"$pwd\dist\delphi\win64" -N0"$pwd\dist\delphi\win64\dcu" -I"$pwd\delphi" -U"$pwd\delphi" "$pwd\delphi\OdcCli.dpr"
          dcc64 -B -Q -E"$pwd\dist\delphi\win64" -N0"$pwd\dist\delphi\win64\dcu" -I"$pwd\delphi" -U"$pwd\delphi" "$pwd\delphi\studio\OdcStudio.dpr"
          Compress-Archive dist\delphi\win32\*.exe "dist\delphi\odc-delphi-$version-windows-x86.zip"
          Compress-Archive dist\delphi\win64\*.exe "dist\delphi\odc-delphi-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-delphi
          path: dist/delphi/*.zip
          if-no-files-found: error
          retention-days: 7

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y rsync zip
      - run: bash scripts/release/package-source.sh dist/source
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/source/*
          if-no-files-found: error
          retention-days: 7
