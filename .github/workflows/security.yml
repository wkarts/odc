name: Security CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build_mode: none }
          - { language: csharp, build_mode: manual }
          - { language: go, build_mode: manual }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Toolchains precisam ser instalados antes do CodeQL init em build-mode manual.
      # No caso de Go, o init injeta o wrapper de tracing sobre o `go` já instalado.
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with: { dotnet-version: '8.0.x' }

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Build C#
        if: matrix.language == 'csharp'
        run: dotnet build csharp-dotnet/Odc.Cli/Odc.Cli.csproj -c Release --no-incremental

      - name: Build Go
        if: matrix.language == 'go'
        working-directory: golang
        run: |
          go clean -cache
          go build -a -o /tmp/odc-codeql ./cmd/odc

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
