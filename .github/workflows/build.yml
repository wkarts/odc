name: Build artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'php-laravel/**'
      - 'delphi/**'
      - 'rust-tauri/**'
      - 'nodejs/**'
      - 'csharp-dotnet/**'
      - 'golang/**'
      - 'typescript/**'
      - 'powershell/**'
      - 'shell/**'
      - 'studio-web/**'
      - 'scripts/**'
      - '.github/workflows/build*.yml'
      - 'VERSION'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-assets.yml
    with:
      version: ${{ needs.version.outputs.version }}
