name: Release manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente ou a criar (ex. v1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-manual-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${{ inputs.tag }}"
          [[ "$TAG" == "v$VERSION" ]] || { echo "Tag $TAG difere de VERSION v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: bash scripts/ci/check-version.sh
      - run: python3 scripts/ci/check-version-sync.py
      - run: bash scripts/ci/validate-tree.sh

  build:
    needs: version
    uses: ./.github/workflows/build-assets.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false
      - run: bash scripts/release/collect-artifacts.sh artifacts release-assets
      - run: bash scripts/release/make-manifest.sh release-assets
      - run: bash scripts/release/checksums.sh release-assets
      - name: Validar nomes e hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/SHA256SUMS.txt
          test -s release-assets/release-manifest.json
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Criar/atualizar tag e GitHub Release
        shell: bash
        run: bash scripts/release/publish-release.sh "$TAG" "$VERSION" release-assets manual
